name: Refresh WFCD data

# Weekly, not daily (owner decision #2). The upstream packages do not change
# often enough to justify a daily run, and every run now costs a PR.
on:
  schedule: [{ cron: '17 6 * * 1' }] # Mondays, 06:17 UTC
  workflow_dispatch:

# One refresh at a time. Runs share a single bot branch, so a second run
# starting mid-flight would fight the first over it. Not cancel-in-progress:
# a half-finished refresh should complete rather than leave a partial branch.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  BRANCH: bot/data-refresh
  # Scratch ref the commit is built on before BRANCH is moved onto it. See the
  # commit step for why it cannot be built on BRANCH directly.
  STAGING: bot/data-refresh-staging

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checks the token can actually WRITE, not merely that it is set. The
      # first real run got through fifteen minutes of install, data:build and
      # tests before dying on a 403 at `git push`, because a token missing
      # Contents: write still authenticates and still passes checkout (which
      # only reads). Failing here costs seconds and says what to fix.
      - name: Require a writable refresh token
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DATA_REFRESH_TOKEN is not set. Create a fine-grained PAT with Contents: Read and write and Pull requests: Read and write, then add it as a repository secret. The default GITHUB_TOKEN cannot be used here: pushes and PRs made with it do not trigger other workflows, so ci.yml would never run on the refresh PR — which is the entire hole this workflow exists to close."
            exit 1
          fi
          # Fails only on an explicit "false", never on an absent or unexpected
          # value. This check exists to catch a read-only token early; it must
          # not become the thing that blocks a working one because GitHub
          # reported the legacy permissions object differently than expected.
          PUSH=$(gh api repos/${{ github.repository }} --jq '.permissions.push // "unknown"' 2>/dev/null || echo unknown)
          if [ "$PUSH" = "false" ]; then
            echo "::error::DATA_REFRESH_TOKEN cannot push to this repository. Grant the fine-grained PAT 'Contents: Read and write' (and 'Pull requests: Read and write'), and make sure its repository access includes ${{ github.repository }}."
            exit 1
          elif [ "$PUSH" != "true" ]; then
            echo "::warning::Could not confirm push access for DATA_REFRESH_TOKEN (permissions.push was '$PUSH'). Continuing; a genuine lack of write access will surface at the push step."
          fi

      # No token override: nothing here pushes with git. The commit and the PR
      # are both written through the API with the PAT further down, which is
      # what makes ci.yml trigger on the result (audit H1).
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Bump the upstream data packages
        run: pnpm update @wfcd/items warframe-worldstate-data

      # Cheap local gate before spending a PR: data:build enforces referential
      # integrity, curated-label resolution and the entity-count floors, and the
      # unit suite catches the rest. ci.yml re-runs everything on the PR.
      - run: pnpm data:build
      - run: pnpm test:unit --run

      - name: Check for changes
        id: changed
        run: |
          if [ -n "$(git status --porcelain package.json pnpm-lock.yaml static/data/dataset.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          fi

      # `git commit` + `git push` would produce an UNSIGNED commit, and main
      # requires verified signatures: the PR would go green and then refuse to
      # merge, forever. Commits written through the GitHub API are signed by
      # GitHub's own web-flow key instead, so this needs no bot signing key —
      # one less secret to leak, rotate, or silently expire. The trade is
      # attribution: the commit is authored by whoever owns DATA_REFRESH_TOKEN
      # rather than by a separate bot identity.
      - name: Commit the refresh through the API, so it is signed
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          BASE=$(git rev-parse HEAD)

          # package.json too, not just the lockfile: `pnpm update` bumps the
          # dependency range there as well, and committing one without the
          # other leaves them disagreeing — every CI job on the PR then dies at
          # `pnpm install --frozen-lockfile` with "specifiers in the lockfile
          # don't match specifiers in package.json", so it could never go green
          # and auto-merge would never fire.
          # The base64 dataset is ~200KB and Linux caps a single argv entry at
          # 128KB, so every hop here moves it through a file or stdin and never
          # through an argument — `--arg contents "$(base64 ...)"` and
          # `--argjson additions "$ADDITIONS"` both die with "Argument list too
          # long". Neither shows up on a small test file; only on the real one.
          for f in package.json pnpm-lock.yaml static/data/dataset.json; do
            if ! git diff --quiet HEAD -- "$f"; then
              base64 -w0 "$f" > "$RUNNER_TEMP/contents.b64"
              jq -n --arg path "$f" --rawfile contents "$RUNNER_TEMP/contents.b64" '$ARGS.named'
            fi
          done | jq -sc . > "$RUNNER_TEMP/additions.json"

          # Reachable only if the change detector and this loop disagree about
          # what changed. An empty commit would be the confusing symptom; say so.
          if [ "$(jq length "$RUNNER_TEMP/additions.json")" -eq 0 ]; then
            echo "::error::Detected changes but found no modified file contents to commit. The change detector and the commit step disagree about which paths to watch."
            exit 1
          fi

          # The commit is built on a scratch ref, not on BRANCH, and only once
          # there is definitely something to commit.
          #
          # createCommitOnBranch needs the branch sitting at the parent commit,
          # so committing on BRANCH directly means resetting it to main first —
          # and in that window the branch is identical to main. GitHub closes
          # any PR whose head stops differing from its base, so that reset
          # closed PR #48 and disabled its auto-merge, and the next step died
          # with "Pull request is closed". `git push --force` never hit this: it
          # moved the ref from last week's commit straight to this week's, one
          # hop, never empty. Building on STAGING restores that property.
          #
          # PATCH's stderr is dropped because "Reference does not exist" is the
          # normal first-run path, not a fault, and reads as alarming in the log.
          # A real failure still surfaces: POST runs next and is not silenced.
          gh api "repos/$REPO/git/refs/heads/$STAGING" -X PATCH -f sha="$BASE" -F force=true --silent 2>/dev/null \
            || gh api "repos/$REPO/git/refs" -X POST -f ref="refs/heads/$STAGING" -f sha="$BASE" --silent

          jq --arg repo "$REPO" --arg branch "$STAGING" --arg oid "$BASE" '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: { input: {
              branch: { repositoryNameWithOwner: $repo, branchName: $branch },
              message: { headline: "chore(data): refresh WFCD dataset" },
              expectedHeadOid: $oid,
              fileChanges: { additions: . }
            }}
          }' "$RUNNER_TEMP/additions.json" > "$RUNNER_TEMP/commit.json"

          NEW=$(gh api graphql --input "$RUNNER_TEMP/commit.json" \
            --jq '.data.createCommitOnBranch.commit.oid')

          # The one hop that matters: BRANCH goes from last week's commit (or
          # nowhere) straight to the finished one, so an open PR sees a normal
          # force-push and keeps both its existence and its auto-merge.
          gh api "repos/$REPO/git/refs/heads/$BRANCH" -X PATCH -f sha="$NEW" -F force=true --silent 2>/dev/null \
            || gh api "repos/$REPO/git/refs" -X POST -f ref="refs/heads/$BRANCH" -f sha="$NEW" --silent

          # Tidy-up only; a leftover scratch ref is force-updated by the next
          # run anyway, so a failure here must not fail an otherwise good run.
          gh api "repos/$REPO/git/refs/heads/$STAGING" -X DELETE --silent || true

          echo "Committed $NEW to $BRANCH."

      - name: Open or update the PR, and let it merge itself on green
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          # Filtered to --state open, and the number captured, both on purpose:
          # `gh pr view <branch>` resolves to the most recent PR for that branch
          # INCLUDING merged ones, so from the second successful refresh onward
          # it would find last week's merged PR, skip creating a new one, and
          # then fail trying to auto-merge something already merged.
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            echo "PR #$NUMBER already open for $BRANCH — the push updated it in place."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): refresh WFCD dataset" \
              --body-file .github/refresh-pr-body.md
            NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          # Auto-merge waits for the required checks; it does not bypass them.
          gh pr merge "$NUMBER" --auto --squash

      # A cron that fails silently is a cron that has been broken for months.
      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Weekly data refresh is failing"
          # Comment on the existing report rather than opening a new issue every
          # week — one thread that grows is easier to act on than seven issues.
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The weekly WFCD data refresh failed.

          Run: $RUN_URL

          Likely causes: an upstream package changed shape and \`pnpm data:build\`
          hit a validation floor; a curated \`nodeLabel\` stopped resolving after a
          game update; or \`DATA_REFRESH_TOKEN\` expired.

          This issue is reused for later failures — check the comments to see how
          long it has been broken."
          fi
